[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topic-research-rag"
version = "0.1.0"
description = "A topic-configurable academic research RAG assistant"
requires-python = ">=3.11,<3.13"
dependencies = [
    "arxiv>=2.1,<3",
    "chromadb>=1.0,<2",
    "google-genai>=1.0,<3",
    "PyMuPDF>=1.24,<2",
    "python-dotenv>=1.0,<2",
    "rank-bm25>=0.2,<1",
    "requests>=2.32,<3",
    "sentence-transformers>=3.0,<7",
    "streamlit>=1.40,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
